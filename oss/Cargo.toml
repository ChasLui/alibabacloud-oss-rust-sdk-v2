[package]
name = "alibabacloud-oss-sdk-rust-v2"
description = "Rust SDK of Alibaba Cloud OSS Service V2"
version = "0.1.0-delta.1"
edition = "2021"
rust-version = "1.69.0"
build = "build.rs"
license = "Apache-2.0"
repository = "https://github.com/aliyun/alibabacloud-oss-rust-sdk-v2"
homepage = "https://github.com/aliyun/alibabacloud-oss-rust-sdk-v2"
authors = ["Alibaba Cloud SDK <sdk@alibabacloud.com>"]
keywords = ["alibabacloud", "oss", "aliyun", "object-storage"]
categories = ["api-bindings"]
readme = "../README.md"

[package.metadata.cargo-udeps.ignore]
development = ["tokio-test"] # used only in doc-tests

[dependencies]
alibabacloud-oss-sdk-rust-v2-api-model = { version = "0.1.0-delta.1", path = "../api_model" }
async-trait = "0.1.80"
base64 = "0.22.1"
bitflags = "2.6.0"
chrono = "0.4.38"
crc = "3.2.1"
hex = "0.4.3"
hmac = "0.12.1"
http = "1.1.0"
lazy_static = "1.5.0"
log = "0.4.22"
md-5 = "0.10.6"
mime_guess = "2.0.5"
quick-xml = { version = "0.36.0", features = ["serialize"] }
rand = "0.8.5"
regex = "1.10.5"
reqwest = { version ="0.12.5", features = ["stream"] }
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.120"
sha1 = "0.10.6"
sha2 = "0.10.8"
tokio = { version = "1.38.0", features = ["full"] }
url = "2.5.2"
urlencoding = "2.1.3"
wait-timeout = "0.2.0"
futures-core = "0.3.30"
futures-util = "0.3.30"  # 添加这行
bytes = "1.6.0"
tokio-util = "0.7.11"
tokio-stream = "0.1.15"

[dev-dependencies]
mockito = "1.4.0"
regex = "1.10.5"
serial_test = "3.1.1"
tokio-test = "0.4.4"