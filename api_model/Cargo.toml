[package]
name = "alibabacloud-oss-sdk-rust-v2-api-model"
description = "API Model for Rust SDK of Alibaba Cloud OSS Service V2"
version = "0.1.0-delta.1"
edition = "2021"
rust-version = "1.60.0"
license = "Apache-2.0"
repository = "https://github.com/aliyun/alibabacloud-oss-rust-sdk-v2"
homepage = "https://github.com/aliyun/alibabacloud-oss-rust-sdk-v2"
authors = ["Alibaba Cloud SDK <sdk@alibabacloud.com>"]
keywords = ["alibabacloud", "oss", "aliyun"]
categories = ["api-bindings"]
readme = "../README.md"

[lib]
proc-macro = true

[dependencies]
quote = "1.0.36"
syn = { version = "<2", features = ["full"] }

[dev-dependencies]
http = "1.1.0"
serde = { version = "1.0.203", features = ["derive"] }
